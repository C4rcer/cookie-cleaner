<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dustpan</title>
  <link rel="stylesheet" href="../shared/base.css">
  <link rel="stylesheet" href="popup.css">
  <link rel="stylesheet" href="../shared/support.css">
</head>
<body>
  <header>
    <span class="brand"><img src="../icons/icon.svg" alt="" width="18" height="18"> Dustpan</span>
    <a class="support-pill" data-support title="Free forever, no ads, no tracking. Tips keep it maintained."><span class="heart">&#x2665;</span> Support</a>
    <button id="btnOptions" class="icon-btn" title="Keep list, activity and settings">&#x2699;</button>
  </header>
  <main>
    <section id="status" class="status" data-state="off">
      <div class="status-line"><span class="dot"></span><span id="statusTitle"></span></div>
      <p id="statusText"></p>
      <div class="row">
        <button id="statusBtn" class="btn primary" type="button"></button>
      </div>
    </section>

    <section id="siteCard">
      <h2>This site</h2>
      <div class="site-head"><span id="siteName" class="site"></span><span id="siteCount" class="muted"></span></div>
      <p id="siteState" class="muted"></p>
      <div class="row" id="siteActions">
        <button id="keepAlways" class="btn" type="button" title="Never clean this site">Keep always</button>
        <button id="keepSession" class="btn" type="button" title="Keep it while Firefox is open. It is cleaned the next time Firefox starts.">Keep until Firefox closes</button>
        <button id="unkeep" class="btn" type="button">Stop keeping</button>
        <button id="cleanSite" class="btn danger" type="button">Clean now</button>
      </div>
    </section>

    <div id="confirm" class="confirm" hidden>
      <p id="confirmText"></p>
      <div class="row">
        <button id="confirmYes" class="btn danger solid" type="button"></button>
        <button id="confirmNo" class="btn" type="button">Cancel</button>
      </div>
    </div>
    <div id="notice" class="notice" hidden>
      <p id="noticeText"></p>
      <div class="row" id="noticeActions"></div>
    </div>

    <section id="pendingBox" hidden>
      <h2 id="pendingTitle">Waiting to be cleaned</h2>
      <ul id="pendingList" class="plain"></ul>
    </section>

    <section id="recentBox">
      <h2>Recent</h2>
      <ul id="recentList" class="plain"></ul>
      <p id="recentEmpty" class="muted">Nothing has been cleaned yet.</p>
    </section>

    <div id="supportCard" hidden></div>
  </main>
  <footer>
    <button id="cleanAll" class="btn" type="button">Clean everything not kept</button>
    <a id="openApp" href="../app/app.html">Keep list and activity</a>
  </footer>
  <script type="module" src="popup.js"></script>
</body>
</html>
